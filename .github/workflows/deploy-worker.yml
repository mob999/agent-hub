name: Deploy Worker

on:
  workflow_dispatch:

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build worker package
        run: pnpm --filter @agent-hub/worker build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy worker to Railway
        run: railway up --service tavro-worker --environment production --project "${{ secrets.RAILWAY_PROJECT_ID }}" --ci
