name: Publish Mobile

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact mobile app version to publish, matching apps/mobile/package.json"
        required: false
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-mobile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Production API URL — the mobile app always talks to the production
      # backend (tavro-api-production.up.railway.app).
      VITE_AGENTHUB_API_URL: https://tavro-api-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          PKG_VERSION=$(node -e "console.log(require('./apps/mobile/package.json').version)")
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "Input version $INPUT_VERSION does not match package version $PKG_VERSION."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $PKG_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify requested version
        shell: bash
        run: |
          node -e 'const pkg = require("./apps/mobile/package.json"); if (pkg.version !== process.env.VERSION) { console.error("Input version " + process.env.VERSION + " does not match mobile package version " + pkg.version + "."); process.exit(1); }'
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Typecheck web
        run: pnpm --filter @agent-hub/web typecheck

      - name: Build workspace dependencies
        run: pnpm --filter @agent-hub/core build

      - name: Build web
        run: pnpm --filter @agent-hub/web build

      - name: Sync Capacitor
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          mv apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/Tavro-AI-${VERSION}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tavro-mobile-apk
          path: dist/Tavro-AI-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      DRAFT: ${{ inputs.draft }}

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: tavro-mobile-apk
          path: mobile-artifacts

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          tag="tavro-mobile-v${VERSION}"
          files=(mobile-artifacts/*)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No APK artifacts were downloaded."
            exit 1
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            exit 0
          fi

          draft_flag=()
          if [ "${DRAFT}" = "true" ]; then
            draft_flag=(--draft)
          fi

          gh release create "${tag}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tavro Mobile ${VERSION}" \
            --notes "Tavro AI Android client ${VERSION} (debug APK)." \
            "${draft_flag[@]}"
