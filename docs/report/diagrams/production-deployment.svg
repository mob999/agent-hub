<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Tavro production deployment topology</title>
  <desc id="desc">A simple production topology showing clients, Vercel web/docs, Railway API and Worker, Supabase database and storage, Redis, npm daemon package, and GitHub Releases for desktop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42526e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .page { fill: #ffffff; }
      .title { fill: #172033; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #5b667a; font: 15px Arial, sans-serif; }
      .section-label { fill: #4b5567; font: 700 13px Arial, sans-serif; letter-spacing: .04em; }
      .box { fill: #ffffff; stroke: #d6dee9; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .box-blue { fill: #eef6ff; stroke: #9dc8ff; }
      .box-green { fill: #eefbf3; stroke: #8fd8ad; }
      .box-orange { fill: #fff6eb; stroke: #ffc888; }
      .box-purple { fill: #f5f1ff; stroke: #c9b8ff; }
      .box-gray { fill: #f8fafc; stroke: #d6dee9; }
      .name { fill: #172033; font: 700 17px Arial, sans-serif; }
      .meta { fill: #526074; font: 13px Arial, sans-serif; }
      .small { fill: #526074; font: 12px Arial, sans-serif; }
      .line { fill: none; stroke: #42526e; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #7b8798; stroke-width: 1.8; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #7b8798; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" width="1180" height="720"/>
  <text class="title" x="64" y="64">生产部署拓扑</text>
  <text class="subtitle" x="64" y="92">Web/API/Worker/DB/对象存储/Daemon/Desktop 分离部署，生产发布由手动 workflow 控制进入 main。</text>

  <text class="section-label" x="68" y="145">CLIENTS</text>
  <rect class="box box-gray" x="64" y="165" width="210" height="100"/>
  <text class="name" x="92" y="205">Web Browser</text>
  <text class="meta" x="92" y="230">访问 Tavro Web / Docs</text>

  <rect class="box box-gray" x="64" y="310" width="210" height="118"/>
  <text class="name" x="92" y="350">Desktop Client</text>
  <text class="meta" x="92" y="375">Electron Web shell</text>
  <text class="meta" x="92" y="398">托管 npx daemon</text>

  <rect class="box box-gray" x="64" y="475" width="210" height="100"/>
  <text class="name" x="92" y="515">Local Daemon</text>
  <text class="meta" x="92" y="540">用户本机 runtime</text>

  <text class="section-label" x="360" y="145">FRONTEND</text>
  <rect class="box box-blue" x="350" y="165" width="240" height="100"/>
  <text class="name" x="383" y="205">Vercel Web</text>
  <text class="meta" x="383" y="230">apps/web 静态 SPA</text>

  <rect class="box box-blue" x="350" y="300" width="240" height="100"/>
  <text class="name" x="383" y="340">Vercel Docs</text>
  <text class="meta" x="383" y="365">apps/docs 静态文档站</text>

  <text class="section-label" x="675" y="145">RAILWAY</text>
  <rect class="box box-green" x="650" y="165" width="230" height="100"/>
  <text class="name" x="682" y="205">API Service</text>
  <text class="meta" x="682" y="230">控制面 / OpenAPI / SSE</text>

  <rect class="box box-green" x="650" y="310" width="230" height="100"/>
  <text class="name" x="682" y="350">Worker Service</text>
  <text class="meta" x="682" y="375">队列消费 / Gateway</text>

  <rect class="box box-green" x="650" y="475" width="230" height="100"/>
  <text class="name" x="682" y="515">Redis</text>
  <text class="meta" x="682" y="540">队列 / 缓存 / 实时协调</text>

  <text class="section-label" x="970" y="145">SUPABASE / RELEASE</text>
  <rect class="box box-orange" x="940" y="165" width="210" height="100"/>
  <text class="name" x="968" y="205">PostgreSQL</text>
  <text class="meta" x="968" y="230">业务权威数据</text>

  <rect class="box box-orange" x="940" y="310" width="210" height="100"/>
  <text class="name" x="968" y="350">Storage S3</text>
  <text class="meta" x="968" y="375">Artifact / Deployment</text>

  <rect class="box box-purple" x="350" y="475" width="240" height="100"/>
  <text class="name" x="383" y="515">npm Registry</text>
  <text class="meta" x="383" y="540">@tavro-ai/daemon</text>

  <rect class="box box-purple" x="940" y="475" width="210" height="100"/>
  <text class="name" x="968" y="515">GitHub Release</text>
  <text class="meta" x="968" y="540">Desktop installers</text>

  <path class="line" d="M274 215 H350"/>
  <path class="line" d="M590 215 H650"/>
  <path class="line" d="M880 215 H940"/>
  <path class="line-soft" d="M765 265 V310"/>
  <path class="line-soft" d="M765 410 V475"/>
  <path class="line-soft" d="M880 360 H940"/>
  <path class="line-soft" d="M880 525 H940"/>
  <path class="line-dashed" d="M274 370 C360 430 395 465 470 475"/>
  <path class="line-dashed" d="M274 525 H350"/>
  <path class="line" d="M274 525 C430 610 610 610 705 575"/>
  <path class="line" d="M765 475 C700 430 625 410 590 390"/>
  <path class="line-soft" d="M650 525 H590"/>

  <text class="small" x="292" y="205">HTTPS</text>
  <text class="small" x="600" y="205">API / SSE</text>
  <text class="small" x="890" y="205">SQL</text>
  <text class="small" x="892" y="350">S3 API</text>
  <text class="small" x="360" y="455">npx install/run</text>
  <text class="small" x="390" y="610">WebSocket outbound</text>

  <rect x="110" y="635" width="960" height="45" rx="12" fill="#111827"/>
  <text x="138" y="663" fill="#ffffff" font="700 14px Arial, sans-serif">发布入口：</text>
  <text x="218" y="663" fill="#ffffff" font="13px Arial, sans-serif">promote workflow fast-forward main 触发 Vercel/Railway 自动部署；daemon 与 desktop 通过手动 workflow 单独发版。</text>
</svg>
