<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Run 生命周期与核心数据流</title>
  <desc id="desc">展示 Tavro / Agent Hub 中用户消息创建 Run、Worker 执行、状态持久化、Artifact 写入和实时推送的核心链路。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="56" y="62" fill="#111827" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700">Run 生命周期与核心数据流</text>
  <text x="56" y="94" fill="#64748b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">主链路自左向右推进，状态与产物向下持久化，实时事件从右侧回推前端</text>

  <rect x="40" y="124" width="1040" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="40" y="222" width="1040" height="86" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="40" y="334" width="1040" height="96" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="40" y="462" width="1040" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="64" y="154" fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">CLIENT</text>
  <text x="64" y="254" fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">CONTROL PLANE</text>
  <text x="64" y="366" fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">EXECUTION PLANE</text>
  <text x="64" y="496" fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">DATA &amp; ARTIFACTS</text>

  <g filter="url(#shadow)">
    <rect x="220" y="138" width="190" height="46" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="220" y="244" width="190" height="46" rx="9" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="485" y="244" width="190" height="46" rx="9" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="750" y="244" width="190" height="46" rx="9" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="220" y="360" width="190" height="46" rx="9" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="480" y="360" width="210" height="46" rx="9" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="760" y="360" width="190" height="46" rx="9" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="330" y="498" width="240" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="660" y="498" width="230" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="315" y="157" fill="#111827" font-size="14" font-weight="700">Web / Desktop</text>
    <text x="315" y="174" fill="#475569" font-size="12">发送消息 / 展示反馈</text>
    <text x="315" y="263" fill="#111827" font-size="14" font-weight="700">API Service</text>
    <text x="315" y="280" fill="#475569" font-size="12">创建 Run / 权限校验</text>
    <text x="580" y="263" fill="#111827" font-size="14" font-weight="700">Redis Queue</text>
    <text x="580" y="280" fill="#475569" font-size="12">queued run</text>
    <text x="845" y="263" fill="#111827" font-size="14" font-weight="700">Realtime Channel</text>
    <text x="845" y="280" fill="#475569" font-size="12">SSE / WebSocket</text>
    <text x="315" y="379" fill="#111827" font-size="14" font-weight="700">Worker</text>
    <text x="315" y="396" fill="#475569" font-size="12">消费 Run / 推进状态</text>
    <text x="585" y="379" fill="#111827" font-size="14" font-weight="700">Daemon / Runtime</text>
    <text x="585" y="396" fill="#475569" font-size="12">本地或云端执行</text>
    <text x="855" y="379" fill="#111827" font-size="14" font-weight="700">Orchestrator</text>
    <text x="855" y="396" fill="#475569" font-size="12">创建 Goal / 分派 Task</text>
    <text x="450" y="517" fill="#111827" font-size="14" font-weight="700">Supabase Storage</text>
    <text x="450" y="534" fill="#475569" font-size="12">Artifact / Deployment 文件</text>
    <text x="775" y="517" fill="#111827" font-size="14" font-weight="700">PostgreSQL</text>
    <text x="775" y="534" fill="#475569" font-size="12">Run / Message / Goal / Task</text>
  </g>

  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M315 184 L315 240" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
    <path d="M410 267 L481 267" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
    <path d="M580 290 L580 320 L315 320 L315 356" stroke="#f97316" marker-end="url(#arrowOrange)"/>
    <path d="M410 383 L476 383" stroke="#f97316" marker-end="url(#arrowOrange)"/>
    <path d="M690 383 L756 383" stroke="#f97316" marker-end="url(#arrowOrange)"/>
    <path d="M835 406 L790 494" stroke="#64748b" marker-end="url(#arrowSlate)"/>
    <path d="M620 406 L470 494" stroke="#64748b" marker-end="url(#arrowSlate)"/>
    <path d="M845 244 L845 220 L1020 220 L1020 156 L414 156" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
    <path d="M855 360 L855 294" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
    <path d="M570 521 L656 521" stroke="#64748b" marker-end="url(#arrowSlate)"/>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">
    <text x="334" y="218" fill="#1d4ed8">1 用户消息</text>
    <text x="428" y="254" fill="#15803d">2 保存 queued / 入队</text>
    <text x="438" y="314" fill="#c2410c">3 Worker 消费</text>
    <text x="422" y="371" fill="#c2410c">4 调用 runtime</text>
    <text x="700" y="371" fill="#c2410c">5 调用 Orchestrator</text>
    <text x="790" y="450" fill="#475569">6 状态与消息</text>
    <text x="510" y="456" fill="#475569">产物文件</text>
    <text x="870" y="330" fill="#15803d">运行事件</text>
    <text x="640" y="144" fill="#1d4ed8">7 前端实时更新</text>
  </g>

  <rect x="120" y="620" width="880" height="44" rx="10" fill="#111827" stroke="#111827"/>
  <text x="560" y="647" fill="#ffffff" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <tspan font-weight="700">状态闭环：</tspan>HTTP 请求只创建 Run；长任务由 Worker / daemon 执行；状态写入数据库后通过实时通道回到客户端。
  </text>
</svg>
