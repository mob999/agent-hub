<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Tavro / Agent Hub 系统总体架构图</title>
  <desc id="desc">A layered system architecture diagram for Tavro / Agent Hub, showing clients, control plane, execution plane, local daemon, runtimes, and infrastructure.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .layer-label { font: 700 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; letter-spacing: .08em; }
      .box-title { font: 700 17px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .box-body { font: 400 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .small { font: 400 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="720" fill="#f8fafc"/>
  <text x="56" y="58" class="title">Tavro / Agent Hub 系统总体架构</text>
  <text x="56" y="84" class="subtitle">以 IM 工作台统一多 Agent 协作、本地执行、运行状态和产物管理</text>

  <rect x="40" y="118" width="1040" height="102" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="146" class="layer-label">CLIENTS</text>
  <rect x="210" y="140" width="240" height="58" rx="14" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <text x="232" y="164" class="box-title">Web SPA</text>
  <text x="232" y="184" class="box-body">Vercel 静态部署 / 浏览器工作台</text>
  <rect x="670" y="140" width="240" height="58" rx="14" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <text x="692" y="164" class="box-title">Desktop Client</text>
  <text x="692" y="184" class="box-body">Electron 壳 / 托管本地执行器</text>

  <rect x="40" y="254" width="1040" height="118" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="64" y="282" class="layer-label">CONTROL PLANE</text>
  <rect x="154" y="294" width="290" height="58" rx="14" fill="#ffffff" stroke="#bbf7d0" filter="url(#shadow)"/>
  <text x="176" y="318" class="box-title">API Service</text>
  <text x="176" y="338" class="box-body">认证 / 会话 / Agent / Run / Artifact 元数据</text>
  <rect x="676" y="294" width="290" height="58" rx="14" fill="#ffffff" stroke="#bbf7d0" filter="url(#shadow)"/>
  <text x="698" y="318" class="box-title">Realtime Channel</text>
  <text x="698" y="338" class="box-body">SSE / WebSocket 推送消息与运行事件</text>

  <rect x="40" y="406" width="1040" height="146" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="64" y="434" class="layer-label">EXECUTION PLANE</text>
  <rect x="116" y="458" width="240" height="58" rx="14" fill="#ffffff" stroke="#fed7aa" filter="url(#shadow)"/>
  <text x="138" y="482" class="box-title">Worker Service</text>
  <text x="138" y="502" class="box-body">队列消费 / Orchestrator / Run 执行</text>
  <rect x="440" y="458" width="240" height="58" rx="14" fill="#ffffff" stroke="#fed7aa" filter="url(#shadow)"/>
  <text x="462" y="482" class="box-title">Daemon Gateway</text>
  <text x="462" y="502" class="box-body">接收本地 daemon 出站连接</text>
  <rect x="764" y="458" width="240" height="58" rx="14" fill="#ffffff" stroke="#fed7aa" filter="url(#shadow)"/>
  <text x="786" y="482" class="box-title">Local Daemon</text>
  <text x="786" y="502" class="box-body">runtime 检测 / 任务执行 / 日志回传</text>

  <rect x="40" y="586" width="1040" height="90" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="64" y="614" class="layer-label">DATA &amp; RUNTIME INFRASTRUCTURE</text>
  <rect x="116" y="628" width="210" height="34" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="138" y="650" class="box-body">PostgreSQL 业务数据</text>
  <rect x="356" y="628" width="190" height="34" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="378" y="650" class="box-body">Redis 队列 / 缓存</text>
  <rect x="576" y="628" width="230" height="34" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="598" y="650" class="box-body">Supabase Storage 产物文件</text>
  <rect x="836" y="628" width="190" height="34" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="858" y="650" class="box-body">Claude / Codex / OpenCode</text>

  <path class="arrow" d="M330 198 L330 294"/>
  <path class="arrow" d="M790 198 L790 294"/>
  <path class="arrow" d="M444 323 L676 323"/>
  <path class="arrow-soft" d="M676 336 C560 390 450 408 290 458"/>
  <path class="arrow" d="M299 352 L242 458"/>
  <path class="arrow" d="M356 487 L440 487"/>
  <path class="arrow" d="M680 487 L764 487"/>
  <path class="arrow-soft" d="M884 458 C884 390 884 360 884 352"/>
  <path class="arrow" d="M884 516 L930 628"/>

  <path class="arrow-soft" d="M235 516 L221 628"/>
  <path class="arrow-soft" d="M299 352 C300 470 300 560 221 628"/>
  <path class="arrow-soft" d="M299 352 C380 470 420 560 451 628"/>
  <path class="arrow-soft" d="M299 352 C510 470 620 560 691 628"/>
  <path class="arrow-soft" d="M236 516 C330 570 470 600 451 628"/>
  <path class="arrow-soft" d="M236 516 C500 570 650 600 691 628"/>

  <text x="64" y="704" class="small">说明：客户端只负责交互展示；API 是控制面；Worker 与 daemon 执行长任务；数据库、缓存和对象存储保存权威状态与产物。</text>
</svg>
